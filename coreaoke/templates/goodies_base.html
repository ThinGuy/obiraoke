<!DOCTYPE html>
<html lang="en">

<head>
  {% if title %}
  <title>{{ site_title }} - {{ title }}</title>
  {% else %}
  <title>{{ site_title }}</title>
  {% endif %}
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/microphone.png') }}">
  <style>
    @font-face {
      font-family: "Ubuntu variable";
      src: url("{{ url_for('static', filename='fonts/ubuntu-variable.woff2') }}") format("woff2");
      font-weight: 100 800;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Ubuntu variable";
      src: url("{{ url_for('static', filename='fonts/ubuntu-variable-italic.woff2') }}") format("woff2");
      font-weight: 100 800;
      font-style: italic;
      font-display: swap;
    }
    @font-face {
      font-family: "Ubuntu Mono variable";
      src: url("{{ url_for('static', filename='fonts/ubuntu-mono-variable.woff2') }}") format("woff2");
      font-weight: 100 800;
      font-style: normal;
      font-display: swap;
    }
  </style>
  <link rel="stylesheet" href="{{ url_for('static', filename='fontello/css/fontello.css') }}?v=2">
  <link rel="stylesheet" href="{{ url_for('static', filename='coreaoke.css') }}">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #f7f7f7;
      color: #000000;
      font-family: "Ubuntu variable", "Ubuntu", -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }
    h1, h2, h3, h4, h5, h6 {
      font-weight: 300;
    }
    a {
      color: #06c;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    .goodies-topbar {
      height: 48px;
      background: #262626;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      border-left: 4px solid #e95420;
    }
    .goodies-topbar-brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 300;
    }
    .goodies-topbar-brand:hover {
      text-decoration: none;
    }
    .goodies-topbar-brand img {
      width: 24px;
      height: 24px;
      object-fit: contain;
    }
    .goodies-topbar-return {
      color: #ffffff;
      font-size: 0.875rem;
      font-weight: 300;
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      padding: 0;
    }
    .goodies-topbar-return:hover {
      text-decoration: underline;
    }
    .goodies-main {
      max-width: 64rem;
      margin: 0 auto;
      padding: 1.5rem;
      background: #ffffff;
      min-height: calc(100vh - 48px);
      box-sizing: border-box;
      border-left: 1px solid rgba(0, 0, 0, 0.1);
      border-right: 1px solid rgba(0, 0, 0, 0.1);
    }
  </style>
  {% block scripts %}{% endblock %}
</head>

<body>
  <header class="goodies-topbar">
    <a href="{{ url_for('home.home') }}" class="goodies-topbar-brand" title="{{ app_name }}">
      <img src="{{ app_icon_url }}" alt="{{ app_name }}">
      <span>{{ app_name }}</span>
    </a>
    <button type="button" class="goodies-topbar-return"
            onclick="try { window.close(); } catch (e) {} if (!window.closed) { window.history.back(); }">
      &larr; Return to Player
    </button>
  </header>
  <main class="goodies-main">
    {% block main_content %}{% endblock %}
  </main>
</body>

</html>
