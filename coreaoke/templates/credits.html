{% extends 'base.html' %} {% block header %}
<h1 style="color: #ffffff; font-size: 1.25rem; font-weight: 300; text-align: left;">Credits &amp; Acknowledgements</h1>
{% endblock %} {% block content %}
<p style="font-size: 0.8rem; color: rgba(255,255,255,0.65);">See main panel.</p>
{% endblock %} {% block main_content %}

<style>
  .credits-section { margin-bottom: 1.5rem; }
  .credits-section h2 {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #6b7280;
    border-top: 1px solid rgba(0,0,0,0.1);
    padding-top: 1.5rem;
    margin-top: 1rem;
    text-align: left;
  }
  .credits-section p {
    font-size: 0.875rem;
    color: #374151;
    line-height: 1.6;
    margin: 0.25rem 0;
  }
</style>

<h1 style="font-size: 1.5rem; font-weight: 300; color: #111827;">Credits &amp; Acknowledgements</h1>

<div class="credits-section">
  <h2>Project</h2>
  <p>To learn more about this project, visit
  <a href="https://github.com/ThinGuy/coreaoke" style="color:#06c">github.com/ThinGuy/coreaoke</a></p>
</div>

<script>
// Emit credits_trigger client-side so the player panel and splash screen
// can show the overlay reliably. The server-side emit in credits.py may
// fire before the socket listeners are ready when this page is loaded
// via sidebar AJAX.
if (window.socket && window.socket.connected) {
  window.socket.emit('credits_trigger');
} else if (window.socket) {
  window.socket.once('connect', function() { window.socket.emit('credits_trigger'); });
}
</script>

{% endblock %}
