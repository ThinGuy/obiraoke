name: obiraoke
base: core24
version: "1.19.0"
summary: Youtube-based karaoke machine for Ubuntu
description: |
  A web-interface karaoke system with YouTube song search, queuing,
  and playback. Supports pitch shifting and streaming.
grade: devel
confinement: devmode

apps:
  obiraoke:
    command: bin/wrapper
    environment:
      PYTHONPATH: $SNAP/lib/python3.12/site-packages
      PATH: $SNAP/usr/bin:$SNAP/bin:$PATH
    plugs:
      - network-bind
      - network
      - audio-playback
      - home

parts:
  obiraoke:
    plugin: python
    source: .
    build-packages:
      - python3-dev
    stage-packages:
      - python3-venv

  wrapper:
    plugin: dump
    source: snap/local/
    organize:
      wrapper: bin/wrapper
