name: obiraoke
base: core24
version: '1.19.0'
summary: OB-01's Karaoke Party
description: |
  YouTube-based karaoke system for Ubuntu. Web interface for song search,
  queuing, and playback with pitch shifting and streaming.
grade: devel
confinement: strict

architectures:
  - build-on: [amd64]

apps:
  obiraoke:
    command: bin/wrapper
    environment:
      PATH: $SNAP/bin:$SNAP/usr/bin:$PATH
      PYTHONPATH: $SNAP/lib/python3.12/site-packages
      LD_LIBRARY_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$SNAP/usr/lib:$LD_LIBRARY_PATH
      PULSE_RUNTIME_PATH: /run/user/1000/pulse
      PULSE_SERVER: unix:/run/user/1000/pulse/native
    plugs:
      - network
      - network-bind
      - audio-playback
      - home
      - removable-media

parts:
  obiraoke:
    plugin: python
    source: .
    python-packages:
      - pip
      - setuptools
    build-packages:
      - libpulse-dev
    stage-packages:
      - ffmpeg
      - libavcodec-extra
      - libpulse0
      - libasound2
      - libasound2-plugins

  wrapper:
    plugin: dump
    source: snap/local
    organize:
      wrapper: bin/wrapper
      pulseaudio-setup: bin/pulseaudio-setup

  deno:
    plugin: nil
    override-build: |
      DENO_URL="https://github.com/denoland/deno/releases/latest/download/deno-x86_64-unknown-linux-gnu.zip"
      curl -fsSL -o deno.zip "${DENO_URL}"
      unzip -o deno.zip -d "${CRAFT_PART_INSTALL}/bin"
      chmod 755 "${CRAFT_PART_INSTALL}/bin/deno"
      rm -f deno.zip
    build-packages:
      - curl
      - unzip
