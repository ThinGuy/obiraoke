name: coraoke
base: core24
version: '1.19.0'
summary: OB-01's Karaoke Party
description: |
  YouTube-based karaoke system for Ubuntu. Web interface for song search,
  queuing, and playback with pitch shifting and streaming.

  Configuration via snap set:
    snap set coraoke port=8080
    snap set coraoke admin-password=secret
    snap set coraoke volume=0.85
    snap set coraoke normalize-audio=true
    snap set coraoke logo-path=/path/to/logo.png
    snap set coraoke prefer-hostname=true
    snap set coraoke autostart=true

  Playback:
    volume               Master volume 0-1 (e.g. 0.85)
    bg-music-volume      Background music volume 0-1 (e.g. 0.5)
    normalize-audio      Normalize audio levels (true/false)
    high-quality         Prefer higher quality downloads (true/false)
    disable-score        Disable singing score display (true/false)
    streaming-format     Streaming format: hls or mp4
    download-path        Song download directory (default: $SNAP_COMMON/coraoke-songs)

  Branding:
    theme                Apply a named theme preset (e.g. snap set coraoke theme=default)
    logo-path            Custom logo image path
    bg-video-path        Custom background video path
    bg-music-path        Custom background music path
    disable-bg-music     Disable background music (true/false)
    disable-bg-video     Disable background video (true/false)
    show-splash-clock    Show clock on splash screen (true/false)
    splash-delay         Splash screen delay in seconds (non-negative integer)
    screensaver-timeout  Screensaver timeout in seconds (non-negative integer)
    hide-url             Hide the URL overlay (true/false)

  Network:
    port                 TCP listen port (1-65535)
    admin-password       Password for the admin interface
    prefer-hostname      Use hostname instead of IP in URLs (true/false)
    proxy                HTTP proxy for yt-dlp (e.g. http://proxy:3128)

  Daemon:
    autostart            Enable daemon mode (true/false)
    headless             Run without a local browser window (default: true)
    log-level            Logging level (DEBUG, INFO, WARNING, ERROR)
grade: devel
confinement: strict

platforms:
  amd64:

apps:
  coraoke:
    command: bin/wrapper
    environment:
      PATH: $SNAP/bin:$SNAP/usr/bin:$PATH
      PYTHONPATH: $SNAP/lib/python3.12/site-packages
      LD_LIBRARY_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$SNAP/usr/lib:$LD_LIBRARY_PATH
      PULSE_RUNTIME_PATH: /run/user/1000/pulse
      PULSE_SERVER: unix:/run/user/1000/pulse/native
    plugs:
      - network
      - network-bind
      - audio-playback
      - home
      - removable-media

  coraoke-server:
    command: bin/wrapper
    daemon: simple
    install-mode: disable
    restart-condition: on-failure
    environment:
      PATH: $SNAP/bin:$SNAP/usr/bin:$PATH
      PYTHONPATH: $SNAP/lib/python3.12/site-packages
      LD_LIBRARY_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$SNAP/usr/lib:$LD_LIBRARY_PATH
      PULSE_RUNTIME_PATH: /run/user/1000/pulse
      PULSE_SERVER: unix:/run/user/1000/pulse/native
    plugs:
      - network
      - network-bind
      - audio-playback
      - home
      - removable-media

parts:
  coraoke:
    plugin: python
    source: .
    python-packages:
      - pip
      - setuptools
    build-packages:
      - libpulse-dev
      - librubberband-dev
    stage-packages:
      - libpulse0
      - libasound2
      - libasound2-plugins
      - librubberband2
      - libslang2
      - libtheora0
      - libass9
      - libfdk-aac2
      - libunibreak5
    prime:
      - -usr/lib/x86_64-linux-gnu/caca/libgl_plugin*
      - -usr/lib/x86_64-linux-gnu/libGLX_mesa*
      - -usr/lib/x86_64-linux-gnu/libXxf86vm*
      - -usr/lib/x86_64-linux-gnu/libcaca++*
      - -usr/lib/x86_64-linux-gnu/libcjson_utils*
      - -usr/lib/x86_64-linux-gnu/libfftw3_omp*
      - -usr/lib/x86_64-linux-gnu/libfftw3_threads*
      - -usr/lib/x86_64-linux-gnu/libflite_cmu_grapheme_lang*
      - -usr/lib/x86_64-linux-gnu/libflite_cmu_grapheme_lex*
      - -usr/lib/x86_64-linux-gnu/libflite_cmu_indic_lang*
      - -usr/lib/x86_64-linux-gnu/libflite_cmu_indic_lex*
      - -usr/lib/x86_64-linux-gnu/libflite_cmu_time_awb*
      - -usr/lib/x86_64-linux-gnu/libhwy_contrib*
      - -usr/lib/x86_64-linux-gnu/libhwy_test*
      - -usr/lib/x86_64-linux-gnu/libicui18n*
      - -usr/lib/x86_64-linux-gnu/libicuio*
      - -usr/lib/x86_64-linux-gnu/libicutest*
      - -usr/lib/x86_64-linux-gnu/libicutu*
      - -usr/lib/x86_64-linux-gnu/libjacknet*
      - -usr/lib/x86_64-linux-gnu/libjackserver*
      - -usr/lib/x86_64-linux-gnu/libpulse-simple*
      - -usr/lib/x86_64-linux-gnu/libsphinxad*
      - -usr/lib/x86_64-linux-gnu/libtheora.so*
      - -usr/lib/x86_64-linux-gnu/libxcb-glx*
      - -usr/lib/x86_64-linux-gnu/libzvbi-chains*
      - -usr/lib/x86_64-linux-gnu/libslang.so.2*

  ffmpeg:
    plugin: autotools
    source: https://ffmpeg.org/releases/ffmpeg-7.1.tar.gz
    source-type: tar
    autotools-configure-parameters:
      - --prefix=/usr
      - --enable-librubberband
      - --enable-gpl
      - --enable-nonfree
      - --disable-static
      - --enable-shared
      - --disable-doc
      - --disable-htmlpages
      - --disable-manpages
      - --disable-podpages
      - --disable-txtpages
      - --enable-libx264
      - --enable-libx265
      - --enable-libvpx
      - --enable-libmp3lame
      - --enable-libopus
      - --enable-libvorbis
      - --enable-libtheora
      - --enable-libwebp
      - --enable-libfdk-aac
      - --enable-libass
      - --enable-libfreetype
    build-packages:
      - librubberband-dev
      - nasm
      - yasm
      - pkg-config
      - libssl-dev
      - libx264-dev
      - libx265-dev
      - libvpx-dev
      - libmp3lame-dev
      - libopus-dev
      - libvorbis-dev
      - libtheora-dev
      - libwebp-dev
      - libfdk-aac-dev
      - libass-dev
      - libfreetype-dev

  wrapper:
    plugin: dump
    source: snap/local
    organize:
      wrapper: bin/wrapper
      pulseaudio-setup: bin/pulseaudio-setup

  deno:
    plugin: nil
    override-build: |
      DENO_URL="https://github.com/denoland/deno/releases/latest/download/deno-x86_64-unknown-linux-gnu.zip"
      curl -fsSL -o deno.zip "${DENO_URL}"
      unzip -o deno.zip -d "${CRAFT_PART_INSTALL}/bin"
      chmod 755 "${CRAFT_PART_INSTALL}/bin/deno"
      rm -f deno.zip
    build-packages:
      - curl
      - unzip
