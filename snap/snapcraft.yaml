name: obiraoke
base: core24
version: '1.19.0'
summary: OB-01's Karaoke Party
description: |
  YouTube-based karaoke system for Ubuntu. Web interface for song search,
  queuing, and playback with pitch shifting and streaming.
grade: devel
confinement: strict

platforms:
  amd64:

apps:
  obiraoke:
    command: bin/wrapper
    environment:
      PATH: $SNAP/bin:$SNAP/usr/bin:$PATH
      PYTHONPATH: $SNAP/lib/python3.12/site-packages
      LD_LIBRARY_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$SNAP/usr/lib:$LD_LIBRARY_PATH
      PULSE_RUNTIME_PATH: /run/user/1000/pulse
      PULSE_SERVER: unix:/run/user/1000/pulse/native
    plugs:
      - network
      - network-bind
      - audio-playback
      - home
      - removable-media

parts:
  obiraoke:
    plugin: python
    source: .
    python-packages:
      - pip
      - setuptools
    build-packages:
      - libpulse-dev
      - librubberband-dev
    stage-packages:
      - libpulse0
      - libasound2
      - libasound2-plugins
      - librubberband2
      - libslang2
      - libtheora0
    prime:
      - -usr/lib/x86_64-linux-gnu/caca/libgl_plugin*
      - -usr/lib/x86_64-linux-gnu/libGLX_mesa*
      - -usr/lib/x86_64-linux-gnu/libXxf86vm*
      - -usr/lib/x86_64-linux-gnu/libcaca++*
      - -usr/lib/x86_64-linux-gnu/libcjson_utils*
      - -usr/lib/x86_64-linux-gnu/libfftw3_omp*
      - -usr/lib/x86_64-linux-gnu/libfftw3_threads*
      - -usr/lib/x86_64-linux-gnu/libflite_cmu_grapheme_lang*
      - -usr/lib/x86_64-linux-gnu/libflite_cmu_grapheme_lex*
      - -usr/lib/x86_64-linux-gnu/libflite_cmu_indic_lang*
      - -usr/lib/x86_64-linux-gnu/libflite_cmu_indic_lex*
      - -usr/lib/x86_64-linux-gnu/libflite_cmu_time_awb*
      - -usr/lib/x86_64-linux-gnu/libhwy_contrib*
      - -usr/lib/x86_64-linux-gnu/libhwy_test*
      - -usr/lib/x86_64-linux-gnu/libicui18n*
      - -usr/lib/x86_64-linux-gnu/libicuio*
      - -usr/lib/x86_64-linux-gnu/libicutest*
      - -usr/lib/x86_64-linux-gnu/libicutu*
      - -usr/lib/x86_64-linux-gnu/libjacknet*
      - -usr/lib/x86_64-linux-gnu/libjackserver*
      - -usr/lib/x86_64-linux-gnu/libpulse-simple*
      - -usr/lib/x86_64-linux-gnu/libsphinxad*
      - -usr/lib/x86_64-linux-gnu/libtheora.so*
      - -usr/lib/x86_64-linux-gnu/libxcb-glx*
      - -usr/lib/x86_64-linux-gnu/libzvbi-chains*

  ffmpeg:
    plugin: autotools
    source: https://ffmpeg.org/releases/ffmpeg-7.1.tar.gz
    source-type: tar
    autotools-configure-parameters:
      - --prefix=/usr
      - --enable-librubberband
      - --enable-gpl
      - --enable-nonfree
      - --disable-static
      - --enable-shared
      - --disable-doc
      - --disable-htmlpages
      - --disable-manpages
      - --disable-podpages
      - --disable-txtpages
    build-packages:
      - librubberband-dev
      - nasm
      - yasm
      - pkg-config
      - libssl-dev

  wrapper:
    plugin: dump
    source: snap/local
    organize:
      wrapper: bin/wrapper
      pulseaudio-setup: bin/pulseaudio-setup

  deno:
    plugin: nil
    override-build: |
      DENO_URL="https://github.com/denoland/deno/releases/latest/download/deno-x86_64-unknown-linux-gnu.zip"
      curl -fsSL -o deno.zip "${DENO_URL}"
      unzip -o deno.zip -d "${CRAFT_PART_INSTALL}/bin"
      chmod 755 "${CRAFT_PART_INSTALL}/bin/deno"
      rm -f deno.zip
    build-packages:
      - curl
      - unzip
